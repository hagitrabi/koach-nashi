<title>חלוקת פרסום – כוח נשי בעסקים, סבב א׳</title>
<style>
:root{--bg:#F7F5F2;--card:#fff;--ink:#241f2b;--mut:#6b6573;--pri:#5B3A70;--green:#128C4A;--line:#e7e1ec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.45}
header{background:var(--pri);color:#fff;padding:16px 16px 12px;position:sticky;top:0;z-index:5}
h1{margin:0 0 4px;font-size:19px}
.sub{font-size:13px;opacity:.9}
.bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tab{flex:1;min-width:110px;min-height:44px;border:0;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.tab[aria-selected=true]{background:#fff;color:var(--pri)}
input[type=search]{flex:1;min-width:180px;min-height:44px;border:0;border-radius:12px;padding:0 14px;font-size:16px}
main{max-width:1100px;margin:0 auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 4px rgba(40,20,60,.08);border:1px solid var(--line)}
.who{font-weight:700;font-size:17px}
.fld{color:var(--mut);font-size:14px;margin-bottom:8px}
.lbl{font-size:13px;color:var(--mut);margin:8px 0 6px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:48px;padding:8px 12px;margin-bottom:6px;border:1px solid var(--green);background:#f1faf5;color:#0b5d31;border-radius:12px;font-size:16px;text-align:right;cursor:pointer;font-family:inherit}
.btn:hover,.btn:active{background:var(--green);color:#fff}
.btn small{color:inherit;opacity:.8;font-size:13px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:30px}
footer{max-width:1100px;margin:0 auto;padding:0 14px 30px;font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<header>
 <h1>חלוקת פרסום – סבב א׳</h1>
 <div class="sub">מצאי את השם שלך ואת מי את מפרסמת. לחיצה על שם פותחת וואטסאפ עם הודעה מוכנה לבקשת לוגו ודף פרסום.</div>
 <div class="bar" id="bar" hidden>
  <input type="search" id="q" placeholder="חיפוש לפי שם" aria-label="חיפוש לפי שם">
 </div>
</header>
<div id="gate" style="max-width:420px;margin:40px auto;padding:0 18px">
 <div style="background:#fff;border-radius:16px;padding:20px;box-shadow:0 1px 6px rgba(40,20,60,.1)">
  <div style="font-weight:700;font-size:18px;margin-bottom:6px">הדף מוגן בסיסמה</div>
  <div style="color:#6b6573;font-size:14px;margin-bottom:12px">הסיסמה נשלחה בקבוצת כוח נשי בעסקים. הקישור בתוקף עד יום ראשון 8.11.2026 בשעה 21:00.</div>
  <input id="pw" type="password" placeholder="סיסמה" autocomplete="current-password" style="width:100%;min-height:48px;border:1px solid #cfc6d6;border-radius:12px;padding:0 14px;font-size:16px">
  <button id="go" style="width:100%;min-height:48px;margin-top:10px;border:0;border-radius:12px;background:#128C4A;color:#fff;font-size:17px;font-weight:700;cursor:pointer">כניסה</button>
  <div id="err" style="color:#b3261e;font-size:14px;margin-top:8px;min-height:18px"></div>
 </div>
</div>

let D=null,P=null;
if(Date.now()>ENC.x){document.addEventListener('DOMContentLoaded',()=>{document.getElementById('gate').innerHTML='<div style="background:#fff;border-radius:16px;padding:22px;text-align:center"><div style="font-weight:700;font-size:18px">הקישור הזה כבר לא בתוקף</div><div style="color:#6b6573;margin-top:8px">בקשי קישור חדש מהמנהלות.</div></div>'})}
let round="a";
function phone(i){return P[i].p}
function open_(i){
  const n=P[i].n, u=P[i].u;
  const m=(u?"היי 🌸 ":"היי "+n+" 🌸 ")+"אשמח לקבל את הלוגו ואת דף הפרסום של העסק שלך, כדי לפרסם אותו בסטטוס. תודה רבה!";
  location.href="https://wa.me/"+phone(i)+"?text="+encodeURIComponent(m);
}
function btn(i){const b=document.createElement("button");b.className="btn";b.type="button";
  b.innerHTML="<span></span><small>וואטסאפ ›</small>";b.firstChild.textContent=P[i].n+(P[i].f?" · "+P[i].f:"");
  b.onclick=()=>open_(i);return b}
function render(){
  const q=document.getElementById("q").value.trim();
  const el=document.getElementById("list"); el.innerHTML="";
  let n=0;
  for(const [w,a,b] of D.rounds[round]){
    if(q && !P[w].n.includes(q)) continue;
    n++;
    const c=document.createElement("section");c.className="card";
    const t=document.createElement("div");t.className="who";t.textContent=P[w].n;
    const f=document.createElement("div");f.className="fld";f.textContent=P[w].f||"";
    const l=document.createElement("div");l.className="lbl";l.textContent="את מפרסמת:";
    c.append(t,f,l,btn(a),btn(b));el.append(c);
  }
  if(!n){const e=document.createElement("div");e.className="empty";e.textContent="לא נמצאה בת בשם הזה";el.append(e)}
}
document.getElementById("q").addEventListener("input",render);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  if(Date.now()>ENC.x) throw new Error('expired');
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.s),iterations:ENC.i,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.v)},key,b64(ENC.c));
  D=JSON.parse(new TextDecoder().decode(pt)); P=D.people;
  document.getElementById("gate").hidden=true; document.getElementById("bar").hidden=false; document.getElementById("list").hidden=false; render();
}
async function tryPw(pw,remember){
  try{ await unlock(pw); if(remember){try{localStorage.setItem("kn_pw",pw)}catch(e){}} return true }
  catch(e){ return false }
}
document.getElementById("go").onclick=async()=>{
  const e=document.getElementById("err"); e.textContent="";
  const ok=await tryPw(document.getElementById("pw").value.trim(),true);
  if(!ok) e.textContent="הסיסמה לא נכונה. נסי שוב.";
};
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("go").click()});
(async()=>{try{const s=localStorage.getItem("kn_pw"); if(s) await tryPw(s,false)}catch(e){}})();
</script>
