<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>ניהול</title>
<style>
:root{--bg:#0e0d1c;--card:#16152b;--card2:#1c1b36;--line:#2c2a4d;--txt:#f1effa;--mut:#9a97bd;--pur:#b79cff;--pur2:#7c5cff;--grn:#34d399;--pnk:#ff4d8d;--yel:#fbbf24;--red:#f87171}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#25194d 0%,transparent 60%),var(--bg);color:var(--txt);font-family:Heebo,Assistant,system-ui,Arial,sans-serif;font-size:16px;min-height:100vh}
.w{max-width:1100px;margin:0 auto;padding:18px 14px 40px}h1{margin:0 0 4px;font-size:26px;font-weight:900}.mut{color:var(--mut);font-size:14px}
input{width:100%;min-height:48px;border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:14px;padding:0 14px;font-size:16px;margin-bottom:10px;font-family:inherit}
button,.lnk{transition:transform .18s ease,box-shadow .18s ease,filter .18s ease,background-color .18s ease;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
.btn{min-height:44px;padding:0 16px;border:0;border-radius:12px;background:var(--pur);color:#1a1238;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 8px 22px rgba(124,92,255,.45)}.btn:active{transform:scale(.96);filter:brightness(.92);box-shadow:none}
.btn.s{background:transparent;color:var(--pur);box-shadow:inset 0 0 0 1.5px var(--line)}.btn.s:hover{color:#fff;box-shadow:inset 0 0 0 1.5px var(--pur)}
.btn.wa{background:#25d366;color:#05301a}.btn.wa:hover{box-shadow:0 8px 22px rgba(37,211,102,.4)}
button:focus-visible,a:focus-visible{outline:3px solid var(--pnk);outline-offset:2px}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center}.stat b{display:block;font-size:30px}.stat span{font-size:12px;color:var(--mut)}
.tabs{display:flex;gap:8px;margin:10px 0}.tabs .btn{flex:1}.tabs .on{background:var(--pur);color:#1a1238;box-shadow:none}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
th,td{padding:10px 10px;text-align:right;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}th{color:var(--mut);font-size:12px;background:var(--card2)}tr:last-child td{border-bottom:0}
.tw{overflow-x:auto;border-radius:16px}
.st{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800}.ok{background:rgba(52,211,153,.15);color:var(--grn)}.wt{background:rgba(251,191,36,.14);color:var(--yel)}
.rg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}.rg b{font-size:17px}
[hidden]{display:none!important}

#gate .box,.gate,.box>div,footer,.sub,.cr,h1,h2,h3,.lbl,.sm{text-align:center}#gate input,.gate input{text-align:center}
